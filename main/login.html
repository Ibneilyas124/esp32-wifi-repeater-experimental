<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WiFi Repeater - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 10px; width: 100%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h2 { margin-bottom: 20px; color: #007bff; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; border: none; color: white; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background: #0056b3; }
        
        /* Floating AI Chat Button & Box */
        .ai-toggle-btn { background: #28a745; margin-top: 15px; }
        .ai-toggle-btn:hover { background: #218838; }
        #aiModal { display: none; margin-top: 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; text-align: left; }
        #chatbox { height: 200px; overflow-y: auto; background: #000; border: 1px solid #333; border-radius: 5px; padding: 10px; margin: 10px 0; font-size: 14px; }
        .msg { margin: 5px 0; padding: 6px 10px; border-radius: 5px; word-wrap: break-word; }
        .user { background: #007bff; text-align: right; margin-left: 20%; }
        .ai { background: #28a745; text-align: left; margin-right: 20%; }
        .err { background: #dc3545; }
        .key-input { font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ESP32 Repeater</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- AI Assistant Without Login -->
        <button type="button" class="ai-toggle-btn" onclick="toggleAI()">🤖 Open AI Assistant</button>

        <div id="aiModal">
            <h4 style="margin:0 0 10px 0;">Free AI Chat (OpenRouter)</h4>
            <input type="password" id="apiKey" class="key-input" placeholder="Enter OpenRouter API Key">
            <button type="button" onclick="saveKey()" style="padding: 5px; font-size:12px; background:#555; margin-top:0;">Save Key</button>
            
            <div id="chatbox"></div>
            
            <input type="text" id="userInput" placeholder="Ask AI anything..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button type="button" onclick="sendMsg()" style="padding:8px; font-size:14px;">Send</button>
        </div>
    </div>

    <script>
        document.getElementById('apiKey').value = localStorage.getItem('openrouter_key') || '';

        function toggleAI() {
            const m = document.getElementById('aiModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }

        function saveKey() {
            const k = document.getElementById('apiKey').value.trim();
            localStorage.setItem('openrouter_key', k);
            alert('API Key saved locally!');
        }

        async function sendMsg() {
            const k = localStorage.getItem('openrouter_key') || document.getElementById('apiKey').value.trim();
            if (!k) { alert('Please enter and save your OpenRouter API Key first!'); return; }

            const inp = document.getElementById('userInput');
            const txt = inp.value.trim();
            if (!txt) return;

            const box = document.getElementById('chatbox');
            box.innerHTML += `<div class="msg user">${txt}</div>`;
            inp.value = '';
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${k}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        'model': 'meta-llama/llama-3.3-70b-instruct:free',
                        'messages': [{ 'role': 'user', 'content': txt }]
                    })
                });
                const d = await res.json();
                if (d.choices && d.choices[0]) {
                    box.innerHTML += `<div class="msg ai">${d.choices[0].message.content}</div>`;
                } else {
                    box.innerHTML += `<div class="msg err">${d.error?.message || 'Error occurred'}</div>`;
                }
            } catch (e) {
                box.innerHTML += `<div class="msg err">Request Failed</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>

</body>
</html>
