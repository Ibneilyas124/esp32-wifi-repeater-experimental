<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 AI Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 15px; background: #121212; color: #fff; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        #chatbox { height: 300px; border: 1px solid #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #000; border-radius: 4px; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; max-width: 80%; }
        .user { background: #007bff; color: #fff; margin-left: auto; text-align: right; }
        .ai { background: #28a745; color: #fff; margin-right: auto; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .key-sec { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>AI Assistant (OpenRouter)</h2>
        <div class="key-sec">
            <input type="password" id="apiKey" placeholder="Enter OpenRouter API Key">
            <button onclick="saveKey()" style="background:#555; padding: 5px; font-size:12px;">Save API Key</button>
        </div>
        <div id="chatbox"></div>
        <input type="text" id="userInput" placeholder="Ask something..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">Send</button>
    </div>

    <script>
        document.getElementById('apiKey').value = localStorage.getItem('openrouter_key') || '';

        function saveKey() {
            const k = document.getElementById('apiKey').value.trim();
            localStorage.setItem('openrouter_key', k);
            alert('API Key Saved Locally!');
        }

        async function sendMsg() {
            const k = localStorage.getItem('openrouter_key') || document.getElementById('apiKey').value.trim();
            if (!k) { alert('Please enter and save your API Key first!'); return; }
            
            const inp = document.getElementById('userInput');
            const txt = inp.value.trim();
            if (!txt) return;

            const box = document.getElementById('chatbox');
            box.innerHTML += `<div class="msg user">${txt}</div>`;
            inp.value = '';
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${k}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        'model': 'meta-llama/llama-3.3-70b-instruct:free',
                        'messages': [{ 'role': 'user', 'content': txt }]
                    })
                });
                const d = await res.json();
                if (d.choices && d.choices[0]) {
                    box.innerHTML += `<div class="msg ai">${d.choices[0].message.content}</div>`;
                } else {
                    box.innerHTML += `<div class="msg ai" style="background:#dc3545">Error: ${d.error?.message || 'Invalid API key or quota exceeded'}</div>`;
                }
            } catch (e) {
                box.innerHTML += `<div class="msg ai" style="background:#dc3545">Request Failed</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
