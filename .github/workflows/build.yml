name: Build ESP32 Firmware

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32
          path: '.'

      - name: Make single padded flash image (flash at 0x0)
        run: |
          pip install "esptool==4.7.0"
          mkdir -p out
          python3 -m esptool --chip esp32 merge_bin -o out/full-flash-0x0.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/esp32-wifi-repeater.bin
          head -c 16384 /dev/zero | tr '\000' '\377' >> out/full-flash-0x0.bin
          ls -l out/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-wifi-repeater-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32-wifi-repeater.bin
            build/flasher_args.json
            out/full-flash-0x0.bin

      - name: Create GitHub Release with binaries
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Firmware build #${{ github.run_number }}
          files: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32-wifi-repeater.bin
            out/full-flash-0x0.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
